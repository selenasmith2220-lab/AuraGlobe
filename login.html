<!DOCTYPE html>
<html>
<head>
    <title>Aura Globe - Login</title>
</head>

<body>

    <h1>Welcome Back 🌐</h1>

    <p>Log in to your Aura Globe account</p>

<form id="login-form">
    <label>Email</label><br>
        <input type="email" placeholder="Enter your email" required><br><br>

        <label>Password</label><br>
        <input type="password" placeholder="Enter your password" required><br><br>

        <button type="submit">Login</button>
    </form>
<script>
document.getElementById("login-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert(error.message);
        return;
    }

    alert("Login successful!");
    window.location.href = "index.html";
});
</script>
    <br>

    <button onclick="location.href='signup.html'">
        Create Account
    </button>

    <br><br>

    <button onclick="location.href='index.html'">
        Go Back
    </button>
<script src="https://myjvvvkbvbatfmsfornk.supabase.co"></script>

<script>
const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>
</body>
</html>
